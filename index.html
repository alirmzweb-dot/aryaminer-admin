<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aryaminer Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230D321B'/><text x='16' y='23' font-family='Arial' font-weight='700' font-size='18' fill='%2351B963' text-anchor='middle'>A</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --dark:#0D321B;--dark2:#081a0f;--dark3:#102a1a;
  --green:#51B963;--green2:#3d9650;
  --bg:#f2f6f3;--white:#fff;
  --border:#d4e8d9;--border2:#b8d9bf;
  --text:#0D321B;--soft:#3d6b4a;--muted:#7a9e84;--faint:#adc8b4;
  --red:#c0392b;--red-bg:#fdf0ef;--red-border:#f5c6c2;
  --amber:#9a6c00;--amber-bg:#fdf8e8;
  --blue:#1251a3;--blue-bg:#eef4ff;--blue-border:#b8d0f8;
  --mono:'DM Mono',monospace;--r:12px;--r-sm:8px;
  --shadow:0 1px 3px rgba(13,50,27,.06),0 4px 16px rgba(13,50,27,.08);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:'DM Sans',sans-serif;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:'DM Sans',sans-serif;outline:none;border:none;background:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* Login */
.screen{display:none;min-height:100vh}
.screen.active{display:flex}
#loginScreen{align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--dark2) 0%,var(--dark) 60%,var(--dark3) 100%);
  position:relative;overflow:hidden}
#loginScreen::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 25% 25%,rgba(81,185,99,.1) 0%,transparent 55%),
             radial-gradient(ellipse at 75% 75%,rgba(81,185,99,.05) 0%,transparent 50%)}
.login-card{position:relative;width:min(400px,92vw);background:rgba(255,255,255,.04);
  border:1px solid rgba(81,185,99,.2);border-radius:20px;padding:40px 36px;backdrop-filter:blur(20px)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.login-hex{width:44px;height:44px;background:var(--green);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:22px}
.login-brand-name{font-size:18px;font-weight:700;color:#fff;letter-spacing:.04em}
.login-brand-sub{font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
.login-role-badge{font-size:10px;color:rgba(255,255,255,.35);background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);padding:3px 10px;border-radius:10px;margin-top:4px;display:inline-block;letter-spacing:.08em}
.lbl{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.pin-in{width:100%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);
  border-radius:var(--r);padding:16px 20px;font-size:24px;color:#fff;
  letter-spacing:.4em;text-align:center;font-family:var(--mono);transition:border .2s}
.pin-in:focus{border-color:rgba(81,185,99,.6)}
.pin-in::placeholder{color:rgba(255,255,255,.2);letter-spacing:.1em}
.login-btn{margin-top:14px;width:100%;background:var(--green);color:#fff;font-weight:700;
  font-size:15px;padding:15px;border-radius:var(--r);transition:all .2s}
.login-btn:hover{background:var(--green2);transform:translateY(-1px);box-shadow:0 4px 20px rgba(81,185,99,.3)}
.login-err{color:#f48a84;font-size:13px;margin-top:10px;min-height:18px;text-align:center}

/* App layout */
#appScreen{flex-direction:row}
.sidebar{width:240px;min-height:100vh;background:var(--dark);display:flex;flex-direction:column;
  position:fixed;left:0;top:0;bottom:0;z-index:50}
.sb-brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.sb-hex{width:32px;height:32px;background:var(--green);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sb-name{font-size:13px;font-weight:700;color:#fff;letter-spacing:.04em}
.sb-sub{font-size:9px;color:rgba(255,255,255,.3);letter-spacing:.1em;text-transform:uppercase}
.sb-admin{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-admin-name{font-size:14px;font-weight:600;color:#fff}
.sb-role{font-size:10px;color:var(--green);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.sb-nav{padding:10px 10px;flex:1;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.nav-i{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--r-sm);
  cursor:pointer;transition:all .15s;color:rgba(255,255,255,.45);font-size:13px;font-weight:500}
.nav-i:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.nav-i.on{background:rgba(81,185,99,.15);color:var(--green)}
.nav-i .ni{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-i .nb{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:2px 6px;font-family:var(--mono)}
.nav-section{font-size:9px;color:rgba(255,255,255,.2);letter-spacing:.12em;text-transform:uppercase;
  padding:10px 11px 4px;font-weight:700}
.sb-footer{padding:12px 18px;border-top:1px solid rgba(255,255,255,.07)}
.logout{font-size:12px;color:rgba(255,255,255,.3);background:none;width:100%;text-align:left;transition:color .15s}
.logout:hover{color:rgba(255,255,255,.6)}

/* Main */
.main{margin-left:240px;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:13px 28px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40}
.topbar-title{font-size:15px;font-weight:700;color:var(--dark);flex:1}
.tb-badge{background:var(--red);color:#fff;font-size:11px;font-weight:700;
  border-radius:20px;padding:3px 9px;font-family:var(--mono)}
.tb-badge.hidden{display:none}
.tb-refresh{font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--border);
  padding:7px 14px;border-radius:var(--r-sm);transition:all .15s}
.tb-refresh:hover{border-color:var(--green2);color:var(--green2)}

/* Pages */
.page{display:none;padding:24px 28px;flex:1}
.page.active{display:block}

/* Dashboard overview */
.overview-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.ov-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);
  padding:16px 18px;position:relative;overflow:hidden}
.ov-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.ov-card.c-blue::after{background:var(--blue)}
.ov-card.c-amber::after{background:#d4a017}
.ov-card.c-red::after{background:var(--red)}
.ov-card.c-green::after{background:var(--green)}
.ov-card.c-muted::after{background:var(--faint)}
.ov-num{font-family:var(--mono);font-size:28px;font-weight:700;line-height:1;margin-bottom:3px}
.ov-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.c-blue .ov-num{color:var(--blue)}
.c-amber .ov-num{color:var(--amber)}
.c-red .ov-num{color:var(--red)}
.c-green .ov-num{color:var(--green2)}
.c-muted .ov-num{color:var(--muted)}

/* Manager cards */
.mgr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.mgr-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);
  overflow:hidden;transition:all .15s;cursor:pointer}
.mgr-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.mgr-card-head{padding:16px 20px;background:linear-gradient(135deg,var(--dark),var(--dark3));
  display:flex;align-items:center;gap:12px}
.mgr-avatar{width:40px;height:40px;background:var(--green);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;
  color:var(--dark);flex-shrink:0}
.mgr-name{font-size:15px;font-weight:700;color:#fff}
.mgr-email{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px}
.mgr-wr{margin-left:auto;text-align:right}
.mgr-wr-num{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--green)}
.mgr-wr-lbl{font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em}
.mgr-card-body{padding:16px 20px}
.mgr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.ms{background:var(--bg);border-radius:var(--r-sm);padding:8px 6px;text-align:center}
.ms-n{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--dark)}
.ms-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.ms.sale .ms-n{color:var(--green2)}.ms.long .ms-n{color:var(--red)}.ms.wait .ms-n{color:var(--amber)}
.mgr-alerts{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.al{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.al-r{background:var(--red-bg);color:var(--red)}.al-a{background:var(--amber-bg);color:var(--amber)}
.al-b{background:var(--blue-bg);color:var(--blue)}
.mgr-chart{margin-top:4px}
.bar-row{display:flex;align-items:flex-end;gap:4px;height:50px}
.bar-c{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.bar-b{border-radius:3px 3px 0 0;min-height:2px;background:var(--green);width:100%}
.bar-v{font-size:8px;color:var(--soft);font-family:var(--mono);font-weight:600}
.bar-l{font-size:8px;color:var(--muted)}

/* Alerts panel */
.alert-panel{background:linear-gradient(135deg,#1f0505,#2d0808);border:1.5px solid rgba(192,57,43,.4);
  border-radius:var(--r);padding:16px 20px;margin-bottom:20px}
.ap-title{font-size:13px;font-weight:700;color:#ef8c87;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ap-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(192,57,43,.2);cursor:pointer}
.ap-item:last-child{border-bottom:none}
.ap-days{font-family:var(--mono);font-size:16px;font-weight:700;color:#ef8c87;width:40px;flex-shrink:0}
.ap-info{flex:1}
.ap-name{font-size:12px;font-weight:600;color:rgba(255,255,255,.8)}
.ap-mgr{font-size:10px;color:rgba(255,255,255,.35)}

/* Messages */
.compose{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px}
.form-lbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.form-in{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:10px 14px;font-size:14px;color:var(--text);transition:border .2s;margin-bottom:12px}
.form-in:focus{border-color:var(--green2)}
.form-ta{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:10px 14px;font-size:13px;color:var(--text);resize:vertical;min-height:80px;
  transition:border .2s;margin-bottom:12px}
.form-ta:focus{border-color:var(--green2)}
.form-sel{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:10px 14px;font-size:14px;color:var(--text);margin-bottom:12px}
.btn-p{background:var(--dark);color:#fff;font-weight:700;font-size:13px;
  padding:11px 20px;border-radius:var(--r);transition:background .15s;cursor:pointer}
.btn-p:hover{background:var(--green2)}
.btn-p.full{width:100%;font-size:14px;padding:13px}
.msg-item{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);
  padding:14px 18px;margin-bottom:8px}
.msg-item.unread{border-color:var(--blue);background:var(--blue-bg)}
.msg-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.msg-from{font-size:13px;font-weight:700;color:var(--dark)}
.msg-role{font-size:10px;background:var(--dark);color:#fff;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em}
.msg-to{font-size:12px;color:var(--muted)}
.msg-phone{font-size:11px;background:var(--tag);color:var(--green2);padding:2px 8px;border-radius:10px;font-weight:700}
.msg-ts{font-size:11px;color:var(--muted);font-family:var(--mono);margin-left:auto}
.msg-text{font-size:13px;color:var(--text);line-height:1.5;margin-bottom:10px}
.msg-btns{display:flex;gap:6px}
.mb{font-size:11px;font-weight:700;padding:6px 12px;border-radius:20px;cursor:pointer}
.mb-reply{background:var(--dark);color:#fff}
.mb-del{background:var(--red-bg);color:var(--red)}
.mb-read{background:var(--bg);border:1px solid var(--border);color:var(--soft)}

/* Report */
.rpt-filters{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-end:center}
.rpt-filters .form-in,.rpt-filters .form-sel{margin-bottom:0}
.export-btn{background:var(--green2);color:#fff;font-weight:700;font-size:13px;
  padding:10px 18px;border-radius:var(--r);display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}
.rpt-table{width:100%;border-collapse:collapse;background:var(--white);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.rpt-table th{background:var(--dark);color:#fff;padding:10px 14px;text-align:left;font-size:11px;letter-spacing:.06em}
.rpt-table td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
.rpt-table tr:last-child td{border-bottom:none}
.rpt-table tr:hover td{background:var(--bg)}
.rpt-section{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);
  padding:20px;margin-bottom:14px}
.rpt-sec-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}

/* PIN modal */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(13,50,27,.5);z-index:200;
  align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-ov.open{display:flex}
.modal{background:var(--white);border-radius:16px;padding:24px;width:min(420px,92vw);box-shadow:0 8px 40px rgba(13,50,27,.2)}
.modal-title{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:16px}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.mb2{flex:1;padding:12px;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer}
.mb2-ok{background:var(--dark);color:#fff}
.mb2-no{background:var(--bg);border:1.5px solid var(--border);color:var(--soft)}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--dark);color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;
  font-weight:600;opacity:0;transition:all .25s;z-index:999;white-space:nowrap;
  box-shadow:0 4px 20px rgba(13,50,27,.25)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.loading{text-align:center;padding:48px;color:var(--muted)}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--green);
  border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .overview-bar{grid-template-columns:repeat(3,1fr)}
  .mgr-grid{grid-template-columns:1fr}
  .rpt-filters{grid-template-columns:1fr 1fr;gap:8px}
  .page{padding:16px}
}
.mob-menu{display:none;background:none;font-size:22px;color:var(--dark);padding:4px;margin-right:4px}
@media(max-width:900px){.mob-menu{display:block}}
#sbOv{display:none;position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.4)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-hex">⬡</div>
      <div>
        <div class="login-brand-name">ARYAMINER</div>
        <div class="login-brand-sub">Admin Portal</div>
      </div>
    </div>
    <div class="lbl">Enter your PIN</div>
    <input id="pinIn" class="pin-in" type="password" inputmode="numeric" maxlength="10" placeholder="• • • •" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">Sign In →</button>
    <div id="loginErr" class="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="appScreen" class="screen">
  <div id="sidebar" class="sidebar">
    <div class="sb-brand">
      <div class="sb-hex">⬡</div>
      <div><div class="sb-name">ARYAMINER</div><div class="sb-sub">Admin Portal</div></div>
    </div>
    <div class="sb-admin">
      <div class="sb-admin-name" id="sbAdminName">—</div>
      <div class="sb-role" id="sbAdminRole">—</div>
    </div>
    <nav class="sb-nav">
      <div class="nav-section">Overview</div>
      <div class="nav-i on" onclick="showPage('dashboard',this)"><span class="ni">📊</span>Dashboard</div>
      <div class="nav-i" onclick="showPage('managers',this)"><span class="ni">👥</span>Managers</div>
      <div class="nav-section">Communication</div>
      <div class="nav-i" onclick="showPage('messages',this)">
        <span class="ni">💬</span>Messages
        <span class="nb hidden" id="navMsgBadge">0</span>
      </div>
      <div class="nav-section">Analysis</div>
      <div class="nav-i" onclick="showPage('reports',this)"><span class="ni">📈</span>Reports</div>
    </nav>
    <div class="sb-footer">
      <button class="logout" onclick="logout()">← Sign out</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <button class="mob-menu" onclick="toggleSb()">☰</button>
      <div class="topbar-title" id="topTitle">Dashboard</div>
      <div class="tb-badge hidden" id="tbMsgBadge">0</div>
      <button class="tb-refresh" onclick="loadData()">↻ Refresh</button>
    </div>

    <!-- DASHBOARD -->
    <div id="pageDashboard" class="page active">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>

    <!-- MANAGERS -->
    <div id="pageManagers" class="page">
      <div id="mgrGrid" class="mgr-grid"></div>
    </div>

    <!-- MESSAGES -->
    <div id="pageMessages" class="page">
      <div class="compose">
        <div style="font-size:13px;font-weight:700;color:var(--dark);margin-bottom:14px">📨 Send Message to Manager</div>
        <div class="form-lbl">To Manager</div>
        <select id="msgTo" class="form-sel"></select>
        <div class="form-lbl">Lead Phone (optional)</div>
        <input id="msgPhone" class="form-in" placeholder="e.g. 2348012345678">
        <div class="form-lbl">Message</div>
        <textarea id="msgTa" class="form-ta" placeholder="Write instruction or note..."></textarea>
        <button class="btn-p full" onclick="sendMsg()">Send Message</button>
      </div>
      <div id="msgList"></div>
    </div>

    <!-- REPORTS -->
    <div id="pageReports" class="page">
      <div class="rpt-filters">
        <div>
          <div class="form-lbl">Manager</div>
          <select id="rptMgr" class="form-sel" style="margin-bottom:0"></select>
        </div>
        <div>
          <div class="form-lbl">From</div>
          <input id="rptFrom" class="form-in" type="date" style="margin-bottom:0">
        </div>
        <div>
          <div class="form-lbl">To</div>
          <input id="rptTo" class="form-in" type="date" style="margin-bottom:0">
        </div>
        <div style="display:flex;align-items:flex-end">
          <button class="btn-p" onclick="runReport()">Generate</button>
        </div>
      </div>
      <div id="rptOut"></div>
    </div>
  </div>
</div>

<!-- PIN MODAL -->
<div id="pinModal" class="modal-ov">
  <div class="modal">
    <div class="modal-title" id="pinModalTitle">Change PIN</div>
    <div class="form-lbl">New PIN</div>
    <input id="pinNewVal" class="form-in" type="text" placeholder="e.g. 4567" maxlength="10">
    <div class="modal-btns">
      <button class="mb2 mb2-no" onclick="closePinModal()">Cancel</button>
      <button class="mb2 mb2-ok" onclick="savePinModal()">Save</button>
    </div>
  </div>
</div>

<div id="sbOv" onclick="toggleSb()"></div>
<div id="toast" class="toast"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxThPTTON7rjIYPiMdO9M0PP3CBxS7iUQIKAKHG8UJEe3A2o2zW-EtuHegwVoACJFGQ/exec";

let PIN="", ADMIN_NAME="", ADMIN_ROLE="", DASH_DATA=null, REPLY_TO=null;
let PENDING_PIN_MGR="";

async function api(p){
  const r=await fetch(SCRIPT_URL+"?data="+encodeURIComponent(JSON.stringify(p)));
  return r.json();
}

// Auth
async function doLogin(){
  const pin=document.getElementById("pinIn").value.trim();
  if(!pin) return;
  const err=document.getElementById("loginErr");
  err.textContent="Checking...";
  const res=await api({action:"login",pin});
  if(res.ok){
    PIN=pin; ADMIN_NAME=res.name; ADMIN_ROLE=res.role;
    err.textContent="";
    showScreen("appScreen");
    document.getElementById("sbAdminName").textContent=ADMIN_NAME;
    document.getElementById("sbAdminRole").textContent=res.role.toUpperCase();
    loadData();
  } else {
    err.textContent=res.error||"Wrong PIN";
    document.getElementById("pinIn").value="";
  }
}
function logout(){PIN="";ADMIN_NAME="";showScreen("loginScreen");document.getElementById("pinIn").value="";}
document.getElementById("pinIn").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
function showScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");}

// Navigation
function showPage(id,el){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".nav-i").forEach(n=>n.classList.remove("on"));
  document.getElementById("page"+id.charAt(0).toUpperCase()+id.slice(1)).classList.add("active");
  if(el) el.classList.add("on");
  const titles={dashboard:"Dashboard",managers:"Managers",messages:"Messages",reports:"Reports"};
  document.getElementById("topTitle").textContent=titles[id]||id;
  if(id==="messages") loadMessages();
  if(id==="managers"&&DASH_DATA) renderManagers(DASH_DATA.managers||[]);
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sbOv").style.display="none";
}
function toggleSb(){
  const sb=document.getElementById("sidebar"),ov=document.getElementById("sbOv");
  const open=sb.classList.contains("open");
  sb.classList.toggle("open",!open);
  ov.style.display=open?"none":"block";
}

// Load data
async function loadData(){
  const res=await api({action:"getDashboard",pin:PIN});
  if(!res.ok){showToast(res.error,true);return;}
  DASH_DATA=res;
  renderDashboard(res);
  // Msg badge
  const mb=document.getElementById("navMsgBadge"),tb=document.getElementById("tbMsgBadge");
  if(res.unreadMessages>0){mb.textContent=res.unreadMessages;mb.classList.remove("hidden");tb.textContent=res.unreadMessages;tb.classList.remove("hidden");}
  else{mb.classList.add("hidden");tb.classList.add("hidden");}
  populateSelects(res.managers||[]);
}

// Dashboard
function renderDashboard(res){
  const managers=res.managers||[];
  const now=new Date();
  const totals=managers.reduce((a,m)=>({
    total:a.total+(m.stats.total||0),new:a.new+(m.stats.new||0),
    waiting:a.waiting+(m.stats.waiting||0),longNeg:a.longNeg+(m.stats.longNeg||0),sale:a.sale+(m.stats.sale||0)
  }),{total:0,new:0,waiting:0,longNeg:0,sale:0});

  // Collect all urgent items across managers
  const allWaiting7=[],allLongNeg14=[];
  managers.forEach(m=>{
    (m.stats.waitingOld||[]).forEach(l=>allWaiting7.push({...l,mgr:m.name}));
    (m.stats.longNegOld||[]).forEach(l=>allLongNeg14.push({...l,mgr:m.name}));
  });

  let html=`
    <div class="overview-bar">
      <div class="ov-card c-blue"><div class="ov-num">${totals.total}</div><div class="ov-lbl">Total Leads</div></div>
      <div class="ov-card c-amber"><div class="ov-num">${totals.new}</div><div class="ov-lbl">New</div></div>
      <div class="ov-card c-amber"><div class="ov-num">${totals.waiting}</div><div class="ov-lbl">Waiting</div></div>
      <div class="ov-card c-red"><div class="ov-num">${totals.longNeg}</div><div class="ov-lbl">Long Neg.</div></div>
      <div class="ov-card c-green"><div class="ov-num">${totals.sale}</div><div class="ov-lbl">Total Sales</div></div>
    </div>`;

  // Alerts
  if(allWaiting7.length>0||allLongNeg14.length>0){
    html+=`<div class="alert-panel">
      <div class="ap-title">🔴 Requires Attention (${allWaiting7.length+allLongNeg14.length} leads)</div>
      ${allLongNeg14.slice(0,3).map(l=>`
        <div class="ap-item">
          <div class="ap-days">${l.days}d</div>
          <div class="ap-info">
            <div class="ap-name">${esc(l.name||l.phone)} ${l.profile?`— ${esc(l.profile.substring(0,40))}...`:""}</div>
            <div class="ap-mgr">Long Neg. · Manager: ${l.mgr}${l.budget?` · ${l.budget}`:""}</div>
          </div>
        </div>`).join("")}
      ${allWaiting7.slice(0,3).map(l=>`
        <div class="ap-item">
          <div class="ap-days">${l.days}d</div>
          <div class="ap-info">
            <div class="ap-name">${esc(l.name||l.phone)}</div>
            <div class="ap-mgr">Waiting · Manager: ${l.mgr}</div>
          </div>
        </div>`).join("")}
    </div>`;
  }

  // Manager comparison cards
  html+=`<div class="mgr-grid">`;
  managers.forEach(m=>{
    const s=m.stats||{};
    const alerts=[];
    if((s.waitingOld||[]).length) alerts.push(`<span class="al al-r">⏰ ${s.waitingOld.length} waiting 7d+</span>`);
    if((s.longNegOld||[]).length) alerts.push(`<span class="al al-a">🔴 ${s.longNegOld.length} long neg 14d+</span>`);
    if(s.new>5) alerts.push(`<span class="al al-b">📥 ${s.new} new</span>`);
    const monthly=s.monthlyCounts||{};
    const mkeys=Object.keys(monthly).sort().slice(-5);
    const maxV=Math.max(...mkeys.map(k=>monthly[k]),1);
    html+=`<div class="mgr-card" onclick="openMgrDetail('${m.name}')">
      <div class="mgr-card-head">
        <div class="mgr-avatar">${m.name.charAt(0).toUpperCase()}</div>
        <div><div class="mgr-name">${m.name}</div><div class="mgr-email">${m.email||""}</div></div>
        <div class="mgr-wr">
          <div class="mgr-wr-num">${s.winRate||0}%</div>
          <div class="mgr-wr-lbl">Win Rate</div>
        </div>
      </div>
      <div class="mgr-card-body">
        <div class="mgr-stats">
          <div class="ms"><div class="ms-n">${s.total||0}</div><div class="ms-l">Total</div></div>
          <div class="ms wait"><div class="ms-n">${s.waiting||0}</div><div class="ms-l">Waiting</div></div>
          <div class="ms long"><div class="ms-n">${s.longNeg||0}</div><div class="ms-l">Long Neg</div></div>
          <div class="ms sale"><div class="ms-n">${s.sale||0}</div><div class="ms-l">Sale</div></div>
        </div>
        ${alerts.length?`<div class="mgr-alerts">${alerts.join("")}</div>`:""}
        ${mkeys.length?`<div class="mgr-chart">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Monthly Volume</div>
          <div class="bar-row">
            ${mkeys.map(k=>{const h=Math.max(Math.round((monthly[k]/maxV)*40),2);return `<div class="bar-c">
              <div class="bar-v">${monthly[k]}</div>
              <div class="bar-b" style="height:${h}px"></div>
              <div class="bar-l">${k.slice(5)}</div>
            </div>`;}).join("")}
          </div>
        </div>`:""}
      </div>
    </div>`;
  });
  html+=`</div>`;
  document.getElementById("pageDashboard").innerHTML=html;
}

function renderManagers(managers){
  document.getElementById("mgrGrid").innerHTML=managers.map(m=>{
    const s=m.stats||{};
    return `<div class="mgr-card">
      <div class="mgr-card-head">
        <div class="mgr-avatar">${m.name.charAt(0).toUpperCase()}</div>
        <div><div class="mgr-name">${m.name}</div><div class="mgr-email">${m.email||""}</div></div>
        <div class="mgr-wr"><div class="mgr-wr-num">${s.winRate||0}%</div><div class="mgr-wr-lbl">Win Rate</div></div>
      </div>
      <div class="mgr-card-body">
        <div class="mgr-stats">
          <div class="ms"><div class="ms-n">${s.total||0}</div><div class="ms-l">Total</div></div>
          <div class="ms wait"><div class="ms-n">${s.waiting||0}</div><div class="ms-l">Waiting</div></div>
          <div class="ms long"><div class="ms-n">${s.longNeg||0}</div><div class="ms-l">Long Neg</div></div>
          <div class="ms sale"><div class="ms-n">${s.sale||0}</div><div class="ms-l">Sale</div></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn-p" style="flex:1;font-size:12px;padding:8px" onclick="sendMsgTo('${m.name}')">Send Note</button>
          ${ADMIN_ROLE==="owner"?`<button class="btn-p" style="font-size:12px;padding:8px;background:var(--amber-bg);color:var(--amber);border:1.5px solid var(--amber-border)" onclick="editPin('${m.name}','${m.pin||""}')">🔑 ${m.pin||"***"}</button>`:""}
        </div>
      </div>
    </div>`;
  }).join("");
}

// Manager detail (open in modal or navigate)
async function openMgrDetail(name){
  const res=await api({action:"getManagerDetail",pin:PIN,managerName:name});
  if(!res.ok){showToast(res.error,true);return;}
  // Navigate to managers page and show details
  showPage("managers",document.querySelectorAll(".nav-i")[1]);
  renderManagers(DASH_DATA.managers||[]);
}

// Messages
function populateSelects(managers){
  const opts=managers.map(m=>`<option value="${m.name}">${m.name}</option>`).join("");
  ["msgTo","rptMgr"].forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    if(id==="rptMgr") el.innerHTML=`<option value="all">All Managers</option>`+opts;
    else el.innerHTML=opts;
  });
  const now=new Date();
  const y=now.getFullYear(),mo=String(now.getMonth()+1).padStart(2,"0"),d=String(now.getDate()).padStart(2,"0");
  const f=document.getElementById("rptFrom"),t=document.getElementById("rptTo");
  if(f) f.value=`${y}-${mo}-01`;
  if(t) t.value=`${y}-${mo}-${d}`;
}

async function loadMessages(){
  const el=document.getElementById("msgList");
  el.innerHTML=`<div class="loading"><div class="spinner"></div></div>`;
  const res=await api({action:"getMessages",pin:PIN});
  if(!res.ok){el.innerHTML=`<div style="color:var(--red)">${res.error}</div>`;return;}
  const msgs=(res.messages||[]).sort((a,b)=>b.timestamp>a.timestamp?1:-1);
  if(!msgs.length){el.innerHTML=`<div style="padding:24px;text-align:center;color:var(--muted)">No messages</div>`;return;}
  el.innerHTML=msgs.map(m=>`
    <div class="msg-item ${m.read==="Yes"?"":"unread"}">
      <div class="msg-meta">
        <span class="msg-from">${m.fromName}</span>
        <span class="msg-role">${m.fromRole}</span>
        <span class="msg-to">→ ${m.toManager}</span>
        ${m.leadPhone?`<span class="msg-phone">📱 ${m.leadPhone}</span>`:""}
        <span class="msg-ts">${m.timestamp}</span>
      </div>
      <div class="msg-text">${esc(m.message)}</div>
      <div class="msg-btns">
        <button class="mb mb-reply" onclick="replyMsg('${m.id}','${m.toManager}','${m.leadPhone||""}')">↩ Reply</button>
        ${ADMIN_ROLE==="owner"?`<button class="mb mb-del" onclick="delMsg(${m.rowIndex})">Delete</button>`:""}
        ${m.read!=="Yes"?`<button class="mb mb-read" onclick="markRead(${m.rowIndex},this)">Mark Read</button>`:""}
      </div>
    </div>`).join("");
}

async function sendMsg(){
  const to=document.getElementById("msgTo").value;
  const phone=document.getElementById("msgPhone").value.trim();
  const msg=document.getElementById("msgTa").value.trim();
  if(!msg) return;
  const res=await api({action:"sendMessage",pin:PIN,toManager:to,leadPhone:phone,message:msg,replyTo:REPLY_TO||""});
  if(res.ok){
    showToast("Sent ✓");
    document.getElementById("msgTa").value="";
    document.getElementById("msgPhone").value="";
    REPLY_TO=null;
    loadMessages();
  } else showToast(res.error,true);
}

function sendMsgTo(name){
  showPage("messages",document.querySelectorAll(".nav-i")[2]);
  setTimeout(()=>{document.getElementById("msgTo").value=name;document.getElementById("msgTa").focus();},100);
}

function replyMsg(id,toManager,leadPhone){
  REPLY_TO=id;
  document.getElementById("msgTo").value=toManager;
  document.getElementById("msgPhone").value=leadPhone||"";
  document.getElementById("msgTa").focus();
  showToast("Replying to message...");
}

async function markRead(rowIndex,btn){
  await api({action:"markRead",pin:PIN,rowIndex});
  if(btn) btn.style.display="none";
  const mb=document.getElementById("navMsgBadge"),tb=document.getElementById("tbMsgBadge");
  const cur=parseInt(mb.textContent||"0")-1;
  if(cur<=0){mb.classList.add("hidden");tb.classList.add("hidden");}
  else{mb.textContent=cur;tb.textContent=cur;}
}

async function delMsg(rowIndex){
  if(!confirm("Delete this message?")) return;
  const res=await api({action:"deleteMessage",pin:PIN,rowIndex});
  if(res.ok){showToast("Deleted");loadMessages();}
  else showToast(res.error,true);
}

// PIN management
function editPin(name,current){
  PENDING_PIN_MGR=name;
  document.getElementById("pinModalTitle").textContent=`Change PIN — ${name}`;
  document.getElementById("pinNewVal").value=current||"";
  document.getElementById("pinModal").classList.add("open");
}
function closePinModal(){document.getElementById("pinModal").classList.remove("open");PENDING_PIN_MGR="";}
async function savePinModal(){
  const newPin=document.getElementById("pinNewVal").value.trim();
  if(!newPin||newPin.length<4){showToast("PIN must be at least 4 digits",true);return;}
  const res=await api({action:"updateManagerPin",pin:PIN,managerName:PENDING_PIN_MGR,newPin});
  if(res.ok){showToast("PIN updated ✓");closePinModal();loadData();}
  else showToast(res.error,true);
}

// Reports
async function runReport(){
  const managerName=document.getElementById("rptMgr").value;
  const dateFrom=document.getElementById("rptFrom").value;
  const dateTo=document.getElementById("rptTo").value;
  const el=document.getElementById("rptOut");
  el.innerHTML=`<div class="loading"><div class="spinner"></div>Generating...</div>`;
  const res=await api({action:"getReport",pin:PIN,managerName,dateFrom,dateTo});
  if(!res.ok){el.innerHTML=`<div style="color:var(--red)">${res.error}</div>`;return;}
  renderReport(res);
}

function renderReport(res){
  const el=document.getElementById("rptOut");
  if(!res.report||!res.report.length){el.innerHTML=`<div style="padding:24px;text-align:center;color:var(--muted)">No data for this period</div>`;return;}
  window._rptData=res;
  let html=`<button class="export-btn" onclick="exportXls()">⬇ Export Excel</button>`;
  res.report.forEach(r=>{
    const s=r.stats||{};
    const monthly=s.monthlyCounts||{};
    const mkeys=Object.keys(monthly).sort();
    html+=`<div class="rpt-section">
      <div class="rpt-sec-title">${r.managerName} — ${res.dateFrom} to ${res.dateTo}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <table class="rpt-table">
          <tr><th>Metric</th><th>Value</th></tr>
          <tr><td>Total Leads</td><td><strong>${s.total||0}</strong></td></tr>
          <tr><td>New</td><td>${s.new||0}</td></tr>
          <tr><td>Waiting</td><td>${s.waiting||0}</td></tr>
          <tr><td>Long Negotiation</td><td>${s.longNeg||0}</td></tr>
          <tr><td>Sale ✓</td><td><strong style="color:var(--green2)">${s.sale||0}</strong></td></tr>
          <tr><td>Lost</td><td>${s.lost||0}</td></tr>
          <tr><td>Bad Lead</td><td>${s.badLead||0}</td></tr>
          <tr><td>No Response</td><td>${s.noResponded||0}</td></tr>
          <tr><td>Win Rate</td><td><strong style="color:var(--green2)">${s.winRate||0}%</strong></td></tr>
          <tr><td>Conv. Rate</td><td>${s.convRate||0}%</td></tr>
        </table>
        ${mkeys.length?`<div>
          <div class="rpt-sec-title">Monthly Volume</div>
          <table class="rpt-table">
            <tr>${mkeys.map(k=>`<th>${k}</th>`).join("")}</tr>
            <tr>${mkeys.map(k=>`<td>${monthly[k]}</td>`).join("")}</tr>
          </table>
        </div>`:""}
      </div>
    </div>`;
  });
  el.innerHTML=html;
}

function exportXls(){
  const res=window._rptData;
  if(!res) return;
  const wb=XLSX.utils.book_new();
  res.report.forEach(r=>{
    const s=r.stats||{};
    const data=[
      ["Manager",r.managerName],["Period",`${res.dateFrom} to ${res.dateTo}`],
      ["Generated",res.generatedAt],[],
      ["Metric","Value"],
      ["Total Leads",s.total||0],["New",s.new||0],["Waiting",s.waiting||0],
      ["Long Negotiation",s.longNeg||0],["Sale",s.sale||0],
      ["Lost",s.lost||0],["Bad Lead",s.badLead||0],["No Response",s.noResponded||0],
      ["Win Rate (%)",s.winRate||0],["Conversion Rate (%)",s.convRate||0],[],
      ["Month","Leads"],
      ...Object.entries(s.monthlyCounts||{}).sort().map(([k,v])=>[k,v]),[],
      ["Phone","Name","Status","Country","Entry Date","Follow Up","Lead Level","Profile","Note"],
      ...(r.leads||[]).map(l=>[l.phone,l.name,l.status,l.country,l.date,l.followup,l.leadlevel,l.profile,l.note])
    ];
    const ws=XLSX.utils.aoa_to_sheet(data);
    ws["!cols"]=[{wch:20},{wch:30}];
    XLSX.utils.book_append_sheet(wb,ws,r.managerName.substring(0,31));
  });
  XLSX.writeFile(wb,`Aryaminer_Report_${res.dateFrom}_${res.dateTo}.xlsx`);
  showToast("Excel downloaded ✓");
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
let toastTimer;
function showToast(msg,isErr=false){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className="toast"+(isErr?" err":"");
  clearTimeout(toastTimer);
  requestAnimationFrame(()=>{t.classList.add("on");toastTimer=setTimeout(()=>t.classList.remove("on"),2500);});
}
</script>
</body>
</html>
