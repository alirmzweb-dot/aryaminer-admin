<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aryaminer Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230D321B'/><text x='16' y='23' font-family='Arial' font-weight='700' font-size='18' fill='%2351B963' text-anchor='middle'>A</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --dk:#0D321B;--dk2:#0a2614;--gn:#51B963;--gn2:#3d9650;
  --bg:#f4f7f5;--wh:#fff;--b1:#dce8df;--b2:#c0d5c5;
  --t1:#0D321B;--t2:#3d6b4a;--t3:#7a9e84;
  --red:#c0392b;--red-bg:#fdecea;--amber:#b7800a;--amber-bg:#fff8e1;
  --blue:#1565c0;--blue-bg:#e3f2fd;
  --r:8px;--mono:monospace;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none}
input,select,textarea{font-family:inherit;outline:none;border:none;background:none}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:200px;background:var(--dk);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:50}
.sb-brand{padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-ico{width:28px;height:28px;background:var(--gn);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;margin-right:8px;vertical-align:middle}
.sb-title{font-size:13px;font-weight:700;color:#fff;letter-spacing:.04em}
.sb-sub{font-size:9px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.sb-admin{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-name{font-size:13px;font-weight:600;color:#fff}
.sb-role{font-size:9px;color:var(--gn);text-transform:uppercase;letter-spacing:.08em;margin-top:1px}
.sb-nav{padding:8px 8px;flex:1;display:flex;flex-direction:column;gap:1px}
.sn{display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:6px;color:rgba(255,255,255,.45);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;width:100%;text-align:left}
.sn:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.sn.on{background:rgba(81,185,99,.18);color:var(--gn)}
.sb-foot{padding:10px 14px;border-top:1px solid rgba(255,255,255,.08)}
.sb-out{font-size:11px;color:rgba(255,255,255,.3);transition:color .15s}
.sb-out:hover{color:rgba(255,255,255,.6)}
.main{margin-left:200px;flex:1}
.topbar{height:44px;background:var(--wh);border-bottom:1px solid var(--b1);padding:0 24px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40}
.tb-title{font-size:14px;font-weight:600;color:var(--t1);flex:1}
.tb-time{font-size:11px;color:var(--t3);font-family:var(--mono)}
.page{display:none;padding:20px 24px}
.page.on{display:block}

/* Login */
#s-login{display:none;min-height:100vh;align-items:center;justify-content:center;background:var(--dk);flex-direction:column}
#s-login.on{display:flex}
.lbox{width:300px;text-align:center}
.l-ico{width:52px;height:52px;background:var(--gn);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 12px}
.l-name{font-size:18px;font-weight:700;color:#fff;margin-bottom:2px}
.l-sub{font-size:11px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.12em;margin-bottom:28px}
.l-lbl{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.l-pin{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:var(--r);padding:13px;font-size:22px;color:#fff;letter-spacing:.4em;text-align:center;font-family:var(--mono);transition:border .2s}
.l-pin:focus{border-color:var(--gn)}
.l-btn{margin-top:12px;width:100%;background:var(--gn);color:#fff;font-weight:700;font-size:14px;padding:12px;border-radius:var(--r);transition:background .15s}
.l-btn:hover{background:var(--gn2)}
.l-err{color:#fca5a5;font-size:12px;margin-top:8px;min-height:16px}

/* Cards */
.card{background:var(--wh);border:1px solid var(--b1);border-radius:var(--r);padding:16px}
.card-title{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}

/* Overview */
.ov-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.ov{background:var(--wh);border:1px solid var(--b1);border-radius:var(--r);padding:14px;border-top:3px solid}
.ov.n{border-top-color:var(--blue)} .ov.w{border-top-color:var(--amber)} .ov.l{border-top-color:var(--red)} .ov.s{border-top-color:var(--gn)} .ov.t{border-top-color:var(--b2)}
.ov-n{font-size:26px;font-weight:700;font-family:var(--mono);line-height:1;margin-bottom:3px}
.ov.n .ov-n{color:var(--blue)} .ov.w .ov-n{color:var(--amber)} .ov.l .ov-n{color:var(--red)} .ov.s .ov-n{color:var(--gn2)} .ov.t .ov-n{color:var(--t2)}
.ov-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}

/* Manager cards */
.mgr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.mgr-card{background:var(--wh);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:box-shadow .15s}
.mgr-card:hover{box-shadow:0 4px 16px rgba(13,50,27,.1)}
.mgr-head{background:var(--dk);padding:14px 16px;display:flex;align-items:center;gap:10px}
.mgr-av{width:36px;height:36px;background:var(--gn);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--dk);flex-shrink:0}
.mgr-n{font-size:14px;font-weight:700;color:#fff}
.mgr-wr{margin-left:auto;text-align:right}
.mgr-wr-n{font-size:20px;font-weight:700;color:var(--gn);font-family:var(--mono)}
.mgr-wr-l{font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em}
.mgr-body{padding:14px 16px}
.mgr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.ms{background:var(--bg);border-radius:6px;padding:7px;text-align:center}
.ms-n{font-size:17px;font-weight:700;font-family:var(--mono);color:var(--t1)}
.ms-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.ms.s .ms-n{color:var(--gn2)} .ms.l .ms-n{color:var(--red)} .ms.w .ms-n{color:var(--amber)}
.mgr-alerts{display:flex;flex-wrap:wrap;gap:5px}
.al{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px}
.al-r{background:var(--red-bg);color:var(--red)} .al-a{background:var(--amber-bg);color:var(--amber)}
.pin-chip{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--gn);background:rgba(81,185,99,.15);padding:2px 8px;border-radius:10px;cursor:pointer}

/* Alert panel */
.alert-box{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
.alert-box-title{font-size:12px;font-weight:700;color:var(--red);margin-bottom:8px}
.alert-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(192,57,43,.15);font-size:12px}
.alert-item:last-child{border-bottom:none}
.alert-days{font-family:var(--mono);font-weight:700;color:var(--red);width:35px}

/* Lead table */
.lead-table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--dk);color:#fff;padding:9px 12px;text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--b1);cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--bg)}
tbody td{padding:9px 12px;color:var(--t1);vertical-align:middle}
.tph{font-family:var(--mono);font-weight:600}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;text-transform:uppercase}
.b-new{background:var(--blue);color:#fff}
.b-wait{background:var(--amber);color:#fff}
.b-long{background:var(--red);color:#fff}
.b-sale{background:var(--gn2);color:#fff}
.b-dead{background:#888;color:#fff}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--wh);border:1px solid var(--b1);border-radius:var(--r);padding:8px 14px;margin-bottom:12px}
.search-bar input{font-size:13px;flex:1;color:var(--t1)}
.search-bar input::placeholder{color:var(--t3)}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fp{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;background:var(--wh);border:1px solid var(--b1);color:var(--t2);cursor:pointer;transition:all .15s}
.fp.on{background:var(--dk);border-color:var(--dk);color:#fff}

/* Lead detail panel */
.lead-detail-panel{position:fixed;top:0;right:0;bottom:0;width:480px;background:var(--wh);border-left:1px solid var(--b1);z-index:200;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s}
.lead-detail-panel.on{transform:translateX(0)}
.ldp-head{padding:14px 18px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px;background:var(--dk)}
.ldp-phone{font-family:var(--mono);font-size:14px;font-weight:700;color:#fff;flex:1}
.ldp-close{font-size:20px;color:rgba(255,255,255,.6);cursor:pointer}
.ldp-save-bar{padding:10px 18px;border-bottom:2px solid var(--gn);background:var(--wh);display:flex;gap:8px}
.ldp-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.sec{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:7px}
.frow{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--b1);gap:8px;background:var(--bg);border-radius:0}
.frow:first-child{border-radius:var(--r) var(--r) 0 0}
.frow:last-child{border-bottom:none;border-radius:0 0 var(--r) var(--r)}
.fg{background:var(--bg);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden}
.fl{font-size:11px;color:var(--t3);width:90px;flex-shrink:0;font-weight:500}
.fv{font-size:12px;color:var(--t1);font-family:var(--mono);flex:1}
.fe{width:100%;font-size:12px;color:var(--t1);border-bottom:1px dashed var(--b2);padding:1px 0}
.fsel{appearance:none;font-size:12px;color:var(--gn2);font-weight:600;cursor:pointer;width:100%;font-family:inherit}
.hist-entry{font-size:10px;font-family:var(--mono);color:var(--t2);background:var(--bg);border-radius:4px;padding:4px 8px;margin-bottom:3px;line-height:1.5}
.note-item{background:var(--bg);border-radius:6px;padding:7px 10px;margin-bottom:5px}
.note-type-tag{font-size:9px;font-weight:700;color:var(--gn2);background:#dcfce7;padding:2px 6px;border-radius:5px;margin-right:6px}
.note-time{font-size:10px;color:var(--t3);font-family:var(--mono)}
.note-text{font-size:12px;color:var(--t2);margin-top:2px;line-height:1.4}
.sale-rec{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:7px 10px;margin-bottom:5px}
.sale-rec-t{font-size:11px;font-weight:700;color:var(--gn2)}
.sale-rec-d{font-size:10px;color:var(--t2);font-family:var(--mono);margin-top:1px}
.pf-ta{width:100%;background:var(--bg);border:1px solid var(--b1);border-radius:6px;padding:9px;font-size:12px;color:var(--t1);resize:vertical;min-height:60px;line-height:1.5;transition:border .2s}
.pf-ta:focus{border-color:var(--gn)}
.ldp-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:199}
.ldp-overlay.on{display:block}

/* Buttons */
.btn{background:var(--dk);color:#fff;font-weight:600;font-size:12px;padding:8px 16px;border-radius:6px;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--gn2)}
.btn.sm{padding:6px 12px;font-size:11px}
.btn.ghost{background:var(--bg);color:var(--t2);border:1px solid var(--b1)}
.btn.ghost:hover{border-color:var(--b2)}
.btn.full{width:100%;padding:10px;font-size:13px}

/* Reports */
.rpt-filters{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;background:var(--wh);border:1px solid var(--b1);border-radius:var(--r);padding:14px}
.rf label{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:4px}
.rf input,.rf select{background:var(--bg);border:1px solid var(--b1);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--t1)}
.rpt-sec{background:var(--wh);border:1px solid var(--b1);border-radius:var(--r);padding:16px;margin-bottom:12px}
.rpt-sec-title{font-size:12px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.rpt-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--bg);border-radius:6px;padding:10px;text-align:center}
.kpi-n{font-size:22px;font-weight:700;font-family:var(--mono);color:var(--t1);line-height:1}
.kpi-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.kpi.s .kpi-n{color:var(--gn2)} .kpi.r .kpi-n{color:var(--red)}

/* PIN modal */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;align-items:center;justify-content:center}
.modal-ov.on{display:flex}
.modal{background:var(--wh);border-radius:10px;padding:20px;width:320px}
.modal-t{font-size:14px;font-weight:700;margin-bottom:12px}
.modal-inp{width:100%;background:var(--bg);border:1px solid var(--b1);border-radius:6px;padding:9px 12px;font-size:14px;font-family:var(--mono);margin-bottom:12px}
.modal-btns{display:flex;gap:8px}
.mb{flex:1;padding:10px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.mb-ok{background:var(--dk);color:#fff}
.mb-no{background:var(--bg);border:1px solid var(--b1);color:var(--t2)}

/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--dk);color:#fff;padding:9px 18px;border-radius:18px;font-size:12px;font-weight:600;opacity:0;transition:all .25s;z-index:999;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.loading{text-align:center;padding:40px;color:var(--t3)}
.sp{width:22px;height:22px;border:2.5px solid var(--b1);border-top-color:var(--gn);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="s-login" class="on">
  <div class="lbox">
    <div class="l-ico">⬡</div>
    <div class="l-name">ARYAMINER</div>
    <div class="l-sub">Admin Portal</div>
    <div class="l-lbl">Enter your PIN</div>
    <input id="pin" class="l-pin" type="password" inputmode="numeric" maxlength="10" placeholder="••••" autocomplete="off">
    <button class="l-btn" onclick="doLogin()">Sign In</button>
    <div id="pin-err" class="l-err"></div>
  </div>
</div>

<!-- APP -->
<div id="s-app" class="app" style="display:none">
  <aside class="sidebar">
    <div class="sb-brand">
      <span class="sb-ico">⬡</span>
      <div style="display:inline-block;vertical-align:middle">
        <div class="sb-title">ARYAMINER</div>
        <div class="sb-sub">Admin Portal</div>
      </div>
    </div>
    <div class="sb-admin">
      <div class="sb-name" id="sb-name">—</div>
      <div class="sb-role" id="sb-role">—</div>
    </div>
    <nav class="sb-nav">
      <button class="sn on" onclick="goPage('dashboard',this)">📊 Dashboard</button>
      <button class="sn" onclick="goPage('managers',this)">👥 Managers</button>
      <button class="sn" onclick="goPage('reports',this)">📈 Reports</button>
    </nav>
    <div class="sb-foot"><button class="sb-out" onclick="logout()">← Sign out</button></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="tb-title" id="tb-title">Dashboard</div>
      <button class="btn sm" onclick="loadDash()">↻ Refresh</button>
    </div>

    <!-- DASHBOARD -->
    <div id="p-dashboard" class="page on">
      <div class="loading"><div class="sp"></div>Loading...</div>
    </div>

    <!-- MANAGERS -->
    <div id="p-managers" class="page">
      <div id="mgr-detail"></div>
    </div>

    <!-- REPORTS -->
    <div id="p-reports" class="page">
      <div class="rpt-filters">
        <div class="rf">
          <label>Manager</label>
          <select id="rpt-mgr" style="min-width:140px"></select>
        </div>
        <div class="rf">
          <label>From</label>
          <input id="rpt-from" type="date">
        </div>
        <div class="rf">
          <label>To</label>
          <input id="rpt-to" type="date">
        </div>
        <button class="btn" onclick="runReport()">Generate</button>
        <button class="btn ghost" onclick="exportXls()" id="btn-export" style="display:none">⬇ Export Excel</button>
      </div>
      <div id="rpt-out"></div>
    </div>
  </div>
</div>

<!-- LEAD DETAIL PANEL -->
<div class="ldp-overlay" id="ldp-ov" onclick="closeLead()"></div>
<div class="lead-detail-panel" id="ldp">
  <div class="ldp-head">
    <div class="ldp-phone" id="ldp-phone">—</div>
    <button class="ldp-close" onclick="closeLead()">✕</button>
  </div>
  <div class="ldp-save-bar" id="ldp-save-bar">
    <button class="btn full" onclick="saveLead()" id="ldp-save-btn">💾 Save Changes</button>
    <button class="btn ghost" onclick="discardLead()" style="flex:0;padding:10px 14px">Discard</button>
  </div>
  <div class="ldp-body" id="ldp-body"></div>
</div>

<!-- PIN MODAL -->
<div class="modal-ov" id="pin-modal">
  <div class="modal">
    <div class="modal-t" id="pin-modal-t">Change PIN</div>
    <input id="pin-new-val" class="modal-inp" type="text" placeholder="New PIN (min 4 digits)" maxlength="10">
    <div class="modal-btns">
      <button class="mb mb-no" onclick="closePinModal()">Cancel</button>
      <button class="mb mb-ok" onclick="savePinModal()">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const SCRIPT_ = "https://script.google.com/macros/s/AKfycbzGjh5_nMKAhl5t86IR13scgtwN8i4IPxJcuZFe_OZCRC25J56cywCPcJCBLIgaTI1-/exec";

let PIN="", ADMIN_NAME="", ADMIN_ROLE="";
let MANAGERS_LIST=[], DASH_DATA=null;
let CUR_MANAGER=null, CUR_LEADS=[], LEAD_FILTER="", LEAD_SEARCH="";
let CUR_LEAD=null, LEAD_PENDING={};
let PENDING_PIN_MGR="", RPT_DATA=null;

const STATUS_OPTS=["","Waiting","Long Negotiation","Sale","Lost - Back to marketing","Bad Lead - Back to marketing","No Responded"];
const FU_OPTS=["","Conversation Start","No Reply — FU 1","No Reply — FU 2","No Reply — Called"];
const LL_OPTS=["","Beginner","User-Intermediate","Reseller","Farm-Company","no responded","bad Leads or wrong"];
const CALL_OPTS=["","No Call Invitation","Call Invited - No Response","Call Scheduled","Call Completed","Call Failed"];

async function api(p){const r=await fetch(SCRIPT_URL+"?data="+encodeURIComponent(JSON.stringify(p)));return r.json();}

// ── Auth ────────────────────────────────────────────────────
async function doLogin(){
  const pin=g("pin").value.trim();if(!pin)return;
  const e=g("pin-err");e.textContent="Checking...";
  const r=await api({action:"login",pin});
  if(r.ok){
    PIN=pin;ADMIN_NAME=r.name;ADMIN_ROLE=r.role;
    g("s-login").classList.remove("on");g("s-app").style.display="flex";
    g("sb-name").textContent=ADMIN_NAME;g("sb-role").textContent=r.role.toUpperCase();
    loadDash();initReports();
  }else{e.textContent=r.error||"Wrong PIN";g("pin").value="";}
}
function logout(){PIN="";g("s-app").style.display="none";g("s-login").classList.add("on");g("pin").value="";}
g("pin").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});

// ── Navigation ───────────────────────────────────────────────
function goPage(id,btn){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
  document.querySelectorAll(".sn").forEach(b=>b.classList.remove("on"));
  g("p-"+id).classList.add("on");if(btn)btn.classList.add("on");
  const titles={dashboard:"Dashboard",managers:"Managers",reports:"Reports"};
  g("tb-title").textContent=titles[id]||id;
}

// ── Dashboard ─────────────────────────────────────────────────
async function loadDash(){
  g("p-dashboard").innerHTML=`<div class="loading"><div class="sp"></div>Loading...</div>`;
  const r=await api({action:"getDashboard",pin:PIN});
  if(!r.ok){g("p-dashboard").innerHTML=`<div style="color:var(--red);padding:20px">${r.error}</div>`;return;}
  DASH_DATA=r;MANAGERS_LIST=r.managers||[];
  renderDash(r);
  populateReportMgr();
}

function renderDash(r){
  const mgrs=r.managers||[];
  const tot=mgrs.reduce((a,m)=>({
    total:a.total+(m.stats.total||0),
    new:a.new+(m.stats.new||0),
    wait:a.wait+(m.stats.waiting||0),
    long:a.long+(m.stats.longNeg||0),
    sale:a.sale+(m.stats.sale||0)
  }),{total:0,new:0,wait:0,long:0,sale:0});

  // Collect all alerts
  const allAlerts=[];
  mgrs.forEach(m=>(m.alerts||[]).forEach(a=>allAlerts.push({...a,mgr:m.name})));

  let h=`<div class="ov-grid">
    <div class="ov t"><div class="ov-n">${tot.total}</div><div class="ov-l">Total Leads</div></div>
    <div class="ov n"><div class="ov-n">${tot.new}</div><div class="ov-l">New</div></div>
    <div class="ov w"><div class="ov-n">${tot.wait}</div><div class="ov-l">Waiting</div></div>
    <div class="ov l"><div class="ov-n">${tot.long}</div><div class="ov-l">Long Neg.</div></div>
    <div class="ov s"><div class="ov-n">${tot.sale}</div><div class="ov-l">Sales ✓</div></div>
  </div>`;

  if(allAlerts.length){
    h+=`<div class="alert-box" style="margin-bottom:16px">
      <div class="alert-box-title">⚠ Requires Attention (${allAlerts.length})</div>
      ${allAlerts.slice(0,6).map(a=>`<div class="alert-item">
        <span class="alert-days">${a.days}d</span>
        <span>${a.name||a.phone}</span>
        <span style="color:var(--t3);margin-left:4px">${a.type==="longNeg"?"Long Neg.":"Waiting"} · ${a.mgr}</span>
      </div>`).join("")}
    </div>`;
  }

  h+=`<div class="mgr-grid">`;
  mgrs.forEach(m=>{
    const s=m.stats||{};
    h+=`<div class="mgr-card" onclick="openManager('${m.name}')">
      <div class="mgr-head">
        <div class="mgr-av">${m.name.charAt(0).toUpperCase()}</div>
        <div>
          <div class="mgr-n">${m.name}</div>
          ${ADMIN_ROLE==="owner"?`<span class="pin-chip" onclick="event.stopPropagation();editPin('${m.name}')">PIN: ${m.pin||"—"}</span>`:""}
        </div>
        <div class="mgr-wr">
          <div class="mgr-wr-n">${s.winRate||0}%</div>
          <div class="mgr-wr-l">Win Rate</div>
        </div>
      </div>
      <div class="mgr-body">
        <div class="mgr-stats">
          <div class="ms"><div class="ms-n">${s.total||0}</div><div class="ms-l">Total</div></div>
          <div class="ms w"><div class="ms-n">${s.waiting||0}</div><div class="ms-l">Waiting</div></div>
          <div class="ms l"><div class="ms-n">${s.longNeg||0}</div><div class="ms-l">Long Neg</div></div>
          <div class="ms s"><div class="ms-n">${s.sale||0}</div><div class="ms-l">Sale</div></div>
        </div>
        ${(m.alerts||[]).length?`<div class="mgr-alerts">
          ${(m.alerts||[]).filter(a=>a.type==="waiting").length?`<span class="al al-r">⏰ ${(m.alerts||[]).filter(a=>a.type==="waiting").length} waiting 7d+</span>`:""}
          ${(m.alerts||[]).filter(a=>a.type==="longNeg").length?`<span class="al al-a">🔴 ${(m.alerts||[]).filter(a=>a.type==="longNeg").length} long neg 14d+</span>`:""}
        </div>`:""}
      </div>
    </div>`;
  });
  h+=`</div><div style="font-size:11px;color:var(--t3);margin-top:12px;text-align:right">Updated: ${r.generatedAt}</div>`;
  g("p-dashboard").innerHTML=h;
}

// ── Manager Detail ───────────────────────────────────────────
async function openManager(name){
  goPage("managers",document.querySelectorAll(".sn")[1]);
  g("mgr-detail").innerHTML=`<div class="loading"><div class="sp"></div>Loading ${name}...</div>`;
  const r=await api({action:"getManagerLeads",pin:PIN,managerName:name});
  if(!r.ok){g("mgr-detail").innerHTML=`<div style="color:var(--red);padding:20px">${r.error}</div>`;return;}
  CUR_MANAGER=name;CUR_LEADS=r.leads||[];LEAD_FILTER="";LEAD_SEARCH="";
  renderManagerView(r);
}

function renderManagerView(r){
  const s=r.stats||{};
  let h=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
    <div style="font-size:16px;font-weight:700;color:var(--t1)">${r.managerName}</div>
    ${ADMIN_ROLE==="owner"?`<span class="pin-chip" onclick="editPin('${r.managerName}')">PIN: ${r.pin||"—"}</span>`:""}
    <button class="btn sm ghost" onclick="loadDash();goPage('dashboard',document.querySelectorAll('.sn')[0])">← Back</button>
    <div style="margin-left:auto;font-size:12px;color:var(--t3)">${s.total||0} total · Win rate: <strong>${s.winRate||0}%</strong></div>
  </div>
  <div class="search-bar"><span style="color:var(--t3)">🔍</span><input placeholder="Search phone or name..." oninput="onLeadSearch(this.value)"></div>
  <div class="filter-row">
    <div class="fp on" onclick="setLeadFilter('',this)">All</div>
    <div class="fp" onclick="setLeadFilter('__new__',this)">New</div>
    <div class="fp" onclick="setLeadFilter('waiting',this)">Waiting</div>
    <div class="fp" onclick="setLeadFilter('long negotiation',this)">Long Neg.</div>
    <div class="fp" onclick="setLeadFilter('sale',this)">Sale ✓</div>
    <div class="fp" onclick="setLeadFilter('lost - back to marketing',this)">Lost</div>
    <div class="fp" onclick="setLeadFilter('no responded',this)">No Resp.</div>
  </div>
  <div class="card">
    <div class="lead-table-wrap" id="lead-table-wrap">`;
  h+=renderLeadTable(CUR_LEADS);
  h+=`</div></div>`;
  g("mgr-detail").innerHTML=h;
}

function renderLeadTable(leads){
  let ls=leads.filter(l=>String(l.phone||"").replace(/[^0-9]/g,"").length>4);
  if(LEAD_SEARCH){const q=LEAD_SEARCH.toLowerCase();ls=ls.filter(l=>String(l.phone||"").includes(q)||String(l.name||"").toLowerCase().includes(q));}
  if(LEAD_FILTER==="__new__")ls=ls.filter(l=>!String(l.status||"").trim()||String(l.status).toLowerCase()==="new");
  else if(LEAD_FILTER)ls=ls.filter(l=>String(l.status||"").toLowerCase().trim()===LEAD_FILTER);
  if(!ls.length)return`<div style="padding:24px;text-align:center;color:var(--t3)">No leads found</div>`;
  return`<table>
    <thead><tr><th>Phone</th><th>Name</th><th>Status</th><th>Follow Up</th><th>Lead Level</th><th>Profile</th><th>Last Modified</th></tr></thead>
    <tbody>${ls.map(l=>{
      const s=String(l.status||"").toLowerCase().trim();
      const bc=s==="sale"?"b-sale":s==="waiting"?"b-wait":s==="long negotiation"?"b-long":["lost - back to marketing","bad lead - back to marketing","no responded"].includes(s)?"b-dead":"b-new";
      const sl=s==="sale"?"SALE ✓":s==="waiting"?"WAIT":s==="long negotiation"?"LONG NEG":["lost - back to marketing","bad lead - back to marketing","no responded"].includes(s)?s.slice(0,7).toUpperCase():"NEW";
      return`<tr onclick="openLead(${l.rowIndex})">
        <td class="tph">${l.phone||"—"}</td>
        <td>${esc(l.name||"")}</td>
        <td><span class="badge ${bc}">${sl}</span></td>
        <td style="color:var(--t2)">${esc(l.followup||"")}</td>
        <td style="color:var(--t2)">${esc(l.leadlevel||"")}</td>
        <td style="color:var(--t3);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.profile||"")}</td>
        <td style="color:var(--t3);font-family:var(--mono);font-size:11px">${l.lastModified||""}</td>
      </tr>`;
    }).join("")}</tbody>
  </table>`;
}

function setLeadFilter(f,btn){LEAD_FILTER=f;document.querySelectorAll(".fp").forEach(b=>b.classList.remove("on"));if(btn)btn.classList.add("on");g("lead-table-wrap").innerHTML=renderLeadTable(CUR_LEADS);}
let sT;function onLeadSearch(v){clearTimeout(sT);sT=setTimeout(()=>{LEAD_SEARCH=v;g("lead-table-wrap").innerHTML=renderLeadTable(CUR_LEADS);},300);}

// ── Lead Detail Panel ────────────────────────────────────────
function openLead(ri){
  CUR_LEAD=CUR_LEADS.find(l=>l.rowIndex===ri);
  if(!CUR_LEAD)return;
  LEAD_PENDING={};
  renderLeadPanel();
  g("ldp").classList.add("on");g("ldp-ov").classList.add("on");
  g("ldp-save-btn").textContent="💾 Save Changes";
}
function closeLead(){g("ldp").classList.remove("on");g("ldp-ov").classList.remove("on");CUR_LEAD=null;LEAD_PENDING={};}

function renderLeadPanel(){
  const l=CUR_LEAD;
  g("ldp-phone").textContent=l.phone||"—";
  const notes=parseNotes(l.notedata);
  const sales=parseSales(l.salesdata);

  const fieldRow=(lbl,content)=>`<div class="frow"><div class="fl">${lbl}</div>${content}</div>`;
  const selField=(lbl,field,opts,cur)=>fieldRow(lbl,`<select class="fsel" onchange="markDirty('${field}',this.value)">${opts.map(o=>`<option value="${o}" ${o===cur?"selected":""}>${o||"—"}</option>`).join("")}</select>`);
  const txtField=(lbl,field,cur,ph="")=>fieldRow(lbl,`<input class="fe" value="${esc(cur||"")}" placeholder="${ph}" oninput="markDirty('${field}',this.value)">`);
  const roField=(lbl,val)=>fieldRow(lbl,`<span class="fv">${esc(String(val||"—"))}</span>`);

  g("ldp-body").innerHTML=`
    ${l.lastChangeDesc?`<div style="background:var(--bg);border:1px solid var(--b1);border-radius:6px;padding:8px 10px;font-size:11px;color:var(--t2)">Last: ${esc(l.lastChangeDesc)}</div>`:""}

    <div><div class="sec">Lead Info</div>
    <div class="fg">
      ${roField("Phone",l.phone)}
      ${txtField("Name","name",l.name,"Customer name")}
      ${roField("Country",l.country)}
      ${roField("Campaign",l.campaign)}
      ${roField("Entry Date",l.date)}
    </div></div>

    <div><div class="sec">Status & Stage</div>
    <div class="fg">
      ${selField("Status","status",STATUS_OPTS,l.status||"")}
      ${selField("Follow Up","followup",FU_OPTS,l.followup||"")}
      ${selField("Lead Level","leadlevel",LL_OPTS,l.leadlevel||"")}
      ${selField("Call","call",CALL_OPTS,l.call||"")}
      ${selField("Priority","priority",["Normal","High"],l.priority||"Normal")}
    </div></div>

    <div><div class="sec">Lead Profile</div>
    <textarea class="pf-ta" oninput="markDirty('profile',this.value)">${esc(l.profile||"")}</textarea></div>

    ${notes.length?`<div><div class="sec">Notes (${notes.length})</div>
    ${notes.map(n=>`<div class="note-item">
      <span class="note-type-tag">${n.type}</span><span class="note-time">${n.time}</span>
      <div class="note-text">${esc(n.text)}</div>
    </div>`).join("")}</div>`:""}

    ${sales.length?`<div><div class="sec">Sales (${sales.length})</div>
    ${sales.map(s=>`<div class="sale-rec">
      <div class="sale-rec-t">${s.model} — ${s.amount} ${s.currency}</div>
      <div class="sale-rec-d">INV: ${s.invoiceNo||"—"} · ${s.date}</div>
    </div>`).join("")}</div>`:""}

    <div><div class="sec">Change History</div>
    ${[["Status",l.histStatus],["Follow Up",l.histFollowup],["Lead Level",l.histLevel],["Call",l.histCall]]
      .filter(([,v])=>v).map(([lb,v])=>`<div style="margin-bottom:8px">
        <div style="font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px">${lb}</div>
        ${v.split("|").reverse().map(e=>`<div class="hist-entry">${e.trim()}</div>`).join("")}
      </div>`).join("")||`<div style="color:var(--t3);font-size:12px">No history yet</div>`}
    </div>
  `;
}

function markDirty(field,value){
  if(String(CUR_LEAD[field]||"")===value)delete LEAD_PENDING[field];
  else LEAD_PENDING[field]=value;
  const n=Object.keys(LEAD_PENDING).length;
  g("ldp-save-btn").textContent=n>0?`💾 Save Changes (${n})`:"💾 Save Changes";
}

async function saveLead(){
  if(!CUR_LEAD||!CUR_MANAGER)return;
  const btn=g("ldp-save-btn");btn.disabled=true;btn.textContent="Saving...";
  let saved=0,errs=[];
  for(const[field,value]of Object.entries(LEAD_PENDING)){
    const r=await api({action:"updateLead",pin:PIN,managerName:CUR_MANAGER,rowIndex:CUR_LEAD.rowIndex,field,value});
    if(r.ok){CUR_LEAD[field]=value;saved++;}else errs.push(r.error);
  }
  LEAD_PENDING={};
  // Update in list
  const idx=CUR_LEADS.findIndex(l=>l.rowIndex===CUR_LEAD.rowIndex);
  if(idx>-1)CUR_LEADS[idx]={...CUR_LEAD};
  g("lead-table-wrap").innerHTML=renderLeadTable(CUR_LEADS);
  if(errs.length)toast(errs[0],true);
  else{toast(saved+" change(s) saved ✓");CUR_LEAD.lastModified=today();renderLeadPanel();}
  btn.disabled=false;btn.textContent="💾 Save Changes";
}

function discardLead(){LEAD_PENDING={};g("ldp-save-btn").textContent="💾 Save Changes";renderLeadPanel();}

// ── Reports ──────────────────────────────────────────────────
function initReports(){
  const now=new Date(),y=now.getFullYear(),mo=String(now.getMonth()+1).padStart(2,"0"),d=String(now.getDate()).padStart(2,"0");
  g("rpt-from").value=`${y}-${mo}-01`;
  g("rpt-to").value=`${y}-${mo}-${d}`;
}
function populateReportMgr(){
  const el=g("rpt-mgr");
  el.innerHTML=`<option value="all">All Managers</option>`+(MANAGERS_LIST||[]).map(m=>`<option value="${m.name}">${m.name}</option>`).join("");
}
async function runReport(){
  const mn=g("rpt-mgr").value,f=g("rpt-from").value,t=g("rpt-to").value;
  g("rpt-out").innerHTML=`<div class="loading"><div class="sp"></div>Generating...</div>`;
  const r=await api({action:"getReport",pin:PIN,managerName:mn,dateFrom:f,dateTo:t});
  if(!r.ok){g("rpt-out").innerHTML=`<div style="color:var(--red)">${r.error}</div>`;return;}
  RPT_DATA=r;renderReport(r);g("btn-export").style.display="inline-flex";
}
function renderReport(r){
  let h="";
  (r.report||[]).forEach(rep=>{
    const s=rep.stats||{},mo=rep.monthlyCounts||{};
    const mkeys=Object.keys(mo).sort();
    h+=`<div class="rpt-sec">
      <div class="rpt-sec-title">${rep.managerName} — ${r.dateFrom||"all"} → ${r.dateTo||"now"}</div>
      <div class="rpt-kpis">
        <div class="kpi"><div class="kpi-n">${s.total||0}</div><div class="kpi-l">Total</div></div>
        <div class="kpi s"><div class="kpi-n">${s.sale||0}</div><div class="kpi-l">Sale ✓</div></div>
        <div class="kpi r"><div class="kpi-n">${s.longNeg||0}</div><div class="kpi-l">Long Neg</div></div>
        <div class="kpi r"><div class="kpi-n">${s.lost||0}</div><div class="kpi-l">Lost</div></div>
        <div class="kpi"><div class="kpi-n">${s.winRate||0}%</div><div class="kpi-l">Win Rate</div></div>
      </div>
      ${mkeys.length?`<div style="font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Monthly Volume</div>
      <table style="margin-bottom:14px"><thead><tr>${mkeys.map(k=>`<th>${k}</th>`).join("")}</tr></thead>
      <tbody><tr>${mkeys.map(k=>`<td>${mo[k]}</td>`).join("")}</tr></tbody></table>`:""}
      <div style="font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">All Leads (${rep.leads.length})</div>
      <div style="overflow-x:auto"><table><thead><tr><th>Phone</th><th>Name</th><th>Status</th><th>Country</th><th>Entry Date</th><th>Follow Up</th><th>Lead Level</th><th>Profile</th></tr></thead>
      <tbody>${(rep.leads||[]).slice(0,200).map(l=>`<tr><td class="tph">${l.phone||""}</td><td>${esc(l.name||"")}</td><td>${esc(l.status||"New")}</td><td>${esc(l.country||"")}</td><td>${l.date||""}</td><td>${esc(l.followup||"")}</td><td>${esc(l.leadlevel||"")}</td><td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.profile||"")}</td></tr>`).join("")}
      </tbody></table></div>
    </div>`;
  });
  g("rpt-out").innerHTML=h||`<div style="padding:24px;color:var(--t3);text-align:center">No data</div>`;
}
function exportXls(){
  if(!RPT_DATA)return;
  const wb=XLSX.utils.book_new();
  (RPT_DATA.report||[]).forEach(rep=>{
    const s=rep.stats||{};
    const rows=[
      ["Manager",rep.managerName],["Period",`${RPT_DATA.dateFrom||""} to ${RPT_DATA.dateTo||""}`],["Generated",RPT_DATA.generatedAt],[],
      ["Metric","Value"],["Total",s.total||0],["Sale",s.sale||0],["Waiting",s.waiting||0],["Long Neg",s.longNeg||0],
      ["Lost",s.lost||0],["Bad Lead",s.badLead||0],["No Responded",s.noResponded||0],["Win Rate %",s.winRate||0],[],
      ["Month","Count"],...Object.entries(rep.monthlyCounts||{}).sort().map(([k,v])=>[k,v]),[],
      ["Phone","Name","Status","Country","Date","Follow Up","Lead Level","Profile","Note","Last Modified"],
      ...(rep.leads||[]).map(l=>[l.phone,l.name,l.status,l.country,l.date,l.followup,l.leadlevel,l.profile,l.note,l.lastModified])
    ];
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[{wch:20},{wch:25},{wch:20},{wch:12},{wch:12},{wch:20},{wch:18},{wch:40},{wch:30},{wch:16}];
    XLSX.utils.book_append_sheet(wb,ws,rep.managerName.substring(0,31));
  });
  XLSX.writeFile(wb,`Aryaminer_Report_${RPT_DATA.dateFrom||"all"}.xlsx`);
  toast("Excel downloaded ✓");
}

// ── PIN modal ────────────────────────────────────────────────
function editPin(name){
  PENDING_PIN_MGR=name;
  g("pin-modal-t").textContent=`Change PIN — ${name}`;
  g("pin-new-val").value="";
  g("pin-modal").classList.add("on");
}
function closePinModal(){g("pin-modal").classList.remove("on");PENDING_PIN_MGR="";}
async function savePinModal(){
  const v=g("pin-new-val").value.trim();
  if(!v||v.length<4){toast("Min 4 digits",true);return;}
  const r=await api({action:"updateManagerPin",pin:PIN,managerName:PENDING_PIN_MGR,newPin:v});
  if(r.ok){toast("PIN updated ✓");closePinModal();loadDash();}else toast(r.error,true);
}

// ── Helpers ──────────────────────────────────────────────────
function g(id){return document.getElementById(id);}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function today(){return new Date().toISOString().slice(0,16).replace("T"," ");}
function parseNotes(raw){if(!raw)return[];return raw.split("\n").filter(Boolean).reverse().map(l=>{const m=l.match(/^\[(.+?)\]\s*\[(.+?)\]\s*(.+)$/);return m?{time:m[1],type:m[2],text:m[3]}:{time:"",type:"Note",text:l};});}
function parseSales(raw){if(!raw)return[];try{return raw.split("|||").map(s=>JSON.parse(s)).reverse();}catch{return[];}}
let tT;function toast(msg,err=false){const t=g("toast");t.textContent=msg;t.className="toast"+(err?" err":"");clearTimeout(tT);requestAnimationFrame(()=>{t.classList.add("on");tT=setTimeout(()=>t.classList.remove("on"),2500);});}
</script>
